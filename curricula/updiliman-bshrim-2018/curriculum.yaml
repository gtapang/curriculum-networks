notes: |
  Encoded from the UC-approved revision document that replaced this
  curriculum with the 2021 one (curricula/updiliman-bshrim-2021), enabling
  the before/after reform comparison.
  Encoding decisions:
  - Prerequisites are taken from the "Existing" side of each revision entry
    (Appendix H pp. 4-11). Two legacy references in those catalog texts name
    courses absent from the 2018 program of study and were mapped to their
    2018 equivalents (both flagged CONFIRM):
      * "HRIM 100 Introduction to Operations" -> HRIM 120 (the June 2018
        revision replaced HRIM 100 with the HRIM 110/120 intro pair)
      * "Accounting 1 Introduction to Financial Accounting" -> HRIM 101
  - Standing-based prerequisites (Sophomore/Junior/Senior Standing, e.g. for
    HRIM 101, HRIM 127, HRIM 128, HRIM 170, HRIM 190, HRIM 199) are not
    course edges and are omitted.
  - Courses whose own prerequisites are not stated anywhere in Appendix H
    carry no incoming edges: HRIM 106, HRIM 112, HRIM 115, HRIM 130,
    HRIM 160, HRIM 174, HRIM 175. CONFIRM against the 2006-2010/2018
    catalogs if available.
  - "Elective 1/2" are the two 3-unit qualified-elective slots (HRIM or
    non-HRIM; options list on Appendix H p. 46).
  - Negative Units mark non-credit requirements (PE x4, NSTP x2, Math 20),
    following the repo convention; positive units sum to the declared 138.
